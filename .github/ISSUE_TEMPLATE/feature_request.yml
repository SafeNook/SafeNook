name: Feature request
description: Suggest an idea or improvement for SafeNook.
labels: ["type:feature"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Please check [the roadmap](https://github.com/SafeNook/safenook/blob/main/docs/ROADMAP.md) and existing issues first; the feature may already be planned.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How you would like it to work. Example commands are welcome.
      placeholder: nook copy github --field username
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or tools you have tried.

  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - CLI
        - Interactive mode
        - Vault format or cryptography
        - Developer workflows (ssh-agent, .env, run)
        - Sync or server
        - Packaging and distribution
        - Documentation
        - Other

  - type: textarea
    id: context
    attributes:
      label: Additional context

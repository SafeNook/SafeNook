# Spike F-4: NSec.Cryptography (libsodium) under native AOT on every target RID.
# Results are recorded in docs/adr/0002-crypto-library.md; see spikes/NSecAotSpike/README.md.
name: Spike NSec AOT

on:
  workflow_dispatch:
  pull_request:
    paths:
      - spikes/**
      - .github/workflows/spike-nsec-aot.yml

permissions:
  contents: read

concurrency:
  group: spike-nsec-aot-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  LIBSODIUM_VERSION: "1.0.22"
  # Public key from https://doc.libsodium.org/installation#integrity-checking
  LIBSODIUM_MINISIGN_KEY: RWQf6LRCGA9i53mlYecO4IzT51TGPpvWucNSCh1CBM0QTaLn73Y7GFO3
  # SHA-256 of the release files; identical on download.libsodium.org and the GitHub release.
  LIBSODIUM_TARBALL_SHA256: adbdd8f16149e81ac6078a03aca6fc03b592b89ef7b5ed83841c086191be3349
  LIBSODIUM_MSVC_SHA256: 3e03a726fac4bc09cb61d8f29d658ef7a5eca0811de59082130414f7ca2e4279

jobs:
  sources:
    name: Fetch and verify libsodium sources
    runs-on: ubuntu-latest
    steps:
      - name: Install minisign
        run: sudo apt-get update && sudo apt-get install -y minisign

      - name: Download and verify
        run: |
          base="https://download.libsodium.org/libsodium/releases"
          for file in "libsodium-${LIBSODIUM_VERSION}.tar.gz" "libsodium-${LIBSODIUM_VERSION}-msvc.zip"; do
            curl -fsSLO "$base/$file"
            curl -fsSLO "$base/$file.minisig"
            minisign -V -P "$LIBSODIUM_MINISIGN_KEY" -m "$file"
          done
          echo "$LIBSODIUM_TARBALL_SHA256  libsodium-${LIBSODIUM_VERSION}.tar.gz" | sha256sum -c -
          echo "$LIBSODIUM_MSVC_SHA256  libsodium-${LIBSODIUM_VERSION}-msvc.zip" | sha256sum -c -

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: libsodium-sources
          path: libsodium-*
          retention-days: 7

  spike:
    name: ${{ matrix.rid }} (${{ matrix.linkage }})
    needs: sources
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, win-arm64, linux-x64, linux-arm64, linux-musl-x64, osx-arm64, osx-x64]
        linkage: [shared, static]
        include:
          - { rid: win-x64,        os: windows-latest }
          - { rid: win-arm64,      os: windows-11-arm }
          - { rid: linux-x64,      os: ubuntu-latest }
          - { rid: linux-arm64,    os: ubuntu-24.04-arm }
          - { rid: linux-musl-x64, os: ubuntu-latest, container: "mcr.microsoft.com/dotnet/sdk:10.0-alpine" }
          - { rid: osx-arm64,      os: macos-latest }
          - { rid: osx-x64,        os: macos-26-intel }
    defaults:
      run:
        shell: bash

    steps:
      - name: Install Alpine prerequisites
        if: matrix.container != ''
        shell: sh
        run: apk add --no-cache bash git clang build-base zlib-dev tar file

      - name: Install Linux prerequisites
        if: runner.os == 'Linux' && matrix.container == ''
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Check out
        uses: actions/checkout@v7

      - name: Set up .NET
        if: matrix.container == ''
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Download verified libsodium sources
        if: matrix.linkage == 'static'
        uses: actions/download-artifact@v8
        with:
          name: libsodium-sources
          path: sodium-src

      - name: Build static libsodium from source
        if: matrix.linkage == 'static' && runner.os != 'Windows'
        run: |
          set -euo pipefail
          cd sodium-src
          sha256() { if command -v sha256sum > /dev/null; then sha256sum "$@"; else shasum -a 256 "$@"; fi; }
          echo "$LIBSODIUM_TARBALL_SHA256  libsodium-${LIBSODIUM_VERSION}.tar.gz" | sha256 -c -
          tar xzf "libsodium-${LIBSODIUM_VERSION}.tar.gz"
          cd "libsodium-${LIBSODIUM_VERSION}"
          # Objects must not target a newer macOS than the AOT binary, or the linker warns.
          export MACOSX_DEPLOYMENT_TARGET=12.0
          ./configure --disable-shared --enable-static --with-pic --disable-dependency-tracking --prefix="$PWD/../prefix" > ../configure.log
          make -j"$(getconf _NPROCESSORS_ONLN)" > ../make.log
          make install > /dev/null
          lib="$(cd ../prefix/lib && pwd)/libsodium.a"
          ls -l "$lib"
          echo "LIBSODIUM_STATIC_LIB=$lib" >> "$GITHUB_ENV"

      - name: Unpack official static libsodium (MSVC)
        if: matrix.linkage == 'static' && runner.os == 'Windows'
        run: |
          set -euo pipefail
          cd sodium-src
          echo "$LIBSODIUM_MSVC_SHA256  libsodium-${LIBSODIUM_VERSION}-msvc.zip" | sha256sum -c -
          unzip -q "libsodium-${LIBSODIUM_VERSION}-msvc.zip"
          arch=$([[ "${{ matrix.rid }}" == "win-arm64" ]] && echo ARM64 || echo x64)
          lib="$(cygpath -w "$PWD/libsodium/$arch/Release/v143/static/libsodium.lib")"
          ls -l "libsodium/$arch/Release/v143/static/libsodium.lib"
          echo "LIBSODIUM_STATIC_LIB=$lib" >> "$GITHUB_ENV"

      - name: Publish native AOT
        run: |
          set -euo pipefail
          static_arg=""
          [[ -n "${LIBSODIUM_STATIC_LIB:-}" ]] && static_arg="-p:LibsodiumStaticLib=$LIBSODIUM_STATIC_LIB"
          dotnet publish spikes/NSecAotSpike -c Release -r ${{ matrix.rid }} -o publish ${static_arg:+"$static_arg"} 2>&1 | tee publish.log
          # TreatWarningsAsErrors (Directory.Build.props) already fails the build on IL/NETSDK warnings;
          # this also catches native linker warnings, which are printed as plain text.
          grep -iE 'warning( [A-Z]+[0-9]+|:)' publish.log > warnings.txt || true
          echo "PUBLISH_WARNINGS=$(wc -l < warnings.txt | tr -d ' ')" >> "$GITHUB_ENV"
          cat warnings.txt

      - name: List published files
        run: ls -l publish

      - name: Show native dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          file publish/nsec-aot-spike
          ldd publish/nsec-aot-spike || true
          if [[ -f publish/libsodium.so ]]; then ldd publish/libsodium.so || true; fi

      - name: Show native dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          file publish/nsec-aot-spike
          otool -L publish/nsec-aot-spike
          if [[ -f publish/libsodium.dylib ]]; then otool -L publish/libsodium.dylib; fi

      - name: Show native dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $dumpbin = & $vswhere -latest -products * -find "VC/Tools/MSVC/**/dumpbin.exe" | Select-Object -First 1
          $files = Get-ChildItem publish -Include *.exe, *.dll -Recurse
          & $dumpbin /nologo /dependents @($files.FullName)
          $vcruntime = ($files | ForEach-Object { & $dumpbin /nologo /dependents $_.FullName } | Select-String -Pattern 'VCRUNTIME' -Quiet)
          "VCRUNTIME_DEPENDENCY=$(if ($vcruntime) { 'yes' } else { 'no' })" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Run the spike
        run: |
          set -euo pipefail
          exe="publish/nsec-aot-spike"
          [[ "$RUNNER_OS" == "Windows" ]] && exe="publish/nsec-aot-spike.exe"
          if [[ "${{ matrix.linkage }}" == "static" ]]; then
            # Prove the binary is self-contained: copy it alone into an empty directory.
            mkdir -p lonely
            cp "$exe" lonely/
            exe="lonely/$(basename "$exe")"
          fi
          "$exe" 2>&1 | tee run.log

      - name: Write job summary
        if: always()
        run: |
          value() { grep -m1 "^SUMMARY $1=" run.log 2>/dev/null | cut -d= -f2- | tr -d '\r' || true; }
          exe="publish/nsec-aot-spike"; [[ "$RUNNER_OS" == "Windows" ]] && exe="publish/nsec-aot-spike.exe"
          size=$( [[ -f "$exe" ]] && wc -c < "$exe" | tr -d ' ' || echo "n/a")
          {
            echo "### ${{ matrix.rid }} (${{ matrix.linkage }}), runner \`${{ matrix.os }}\`${{ matrix.container && format(' + {0}', matrix.container) || '' }}"
            echo
            echo "| Result | Publish warnings | Binary size, bytes | libsodium next to binary | libsodium version | Argon2id 64 MiB t=3, ms | Argon2id 256 MiB t=3, ms | VCRUNTIME dependency |"
            echo "|---|---|---|---|---|---|---|---|"
            echo "| $(value result) | ${PUBLISH_WARNINGS:-n/a} | $size | $(value libsodium-file) | $(value libsodium-version) | $(value argon2id-64mib-t3-ms) | $(value argon2id-256mib-t3-ms) | ${VCRUNTIME_DEPENDENCY:-n/a} |"
            echo
            if [[ -f run.log ]]; then
              echo '<details><summary>Spike output</summary>'
              echo
              echo '```'
              grep -v '^SUMMARY ' run.log | tr -d '\r'
              echo '```'
              echo '</details>'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload published files
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: spike-${{ matrix.rid }}-${{ matrix.linkage }}
          path: |
            publish/
            publish.log
            run.log
          if-no-files-found: ignore
          retention-days: 7
